# 2026-07-08	mise-en-place configuration

[env]
LOCAL_FOLDER = 'dist'
NPM = 'pnpm'
REMOTE_FOLDER = 'chgroup'
REMOTE_HOST = 'fd-debian-scw'
REMOTE_PATH = '/data/nginx/www'

[hooks]
enter = { task = "enter" }

[tasks.enter]
depends = ["enter-common"]

[shell_alias]
als = "mise shell-alias"
bld = "${NPM} run build"
check = "${NPM} run check"
clean = "${NPM} run clean"
deploy = "rsync -r -v ${LOCAL_FOLDER}/ ${REMOTE_HOST}:${REMOTE_PATH}/${REMOTE_FOLDER}"
dev = "${NPM} run dev"
fmtchk = "${NPM} run fmt:check"
fmtfix = "${NPM} run fmt:fix"
install = "${NPM} install"
upgrade = "${NPM} run upgrade"
update = "${NPM} run update"
